kind = "web"
previewPath = "/"
title = "Mindmap"
description = "A private, space-inspired mindmap for directors and managers to capture, classify, explore, complete, and remove workplace concerns and tasks without exposing sensitive notes to a secretary or shared inbox."
version = "1.0.0"
id = "artifacts/quiet-mindmap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24273

[services.development]
run = "pnpm --filter @workspace/quiet-mindmap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quiet-mindmap", "run", "build" ]
serve = "static"
publicDir = "artifacts/quiet-mindmap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24273"
BASE_PATH = "/"
